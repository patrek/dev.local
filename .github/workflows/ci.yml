name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyser les scripts Bash
        # Version figée par l'image : même résultat qu'avec "just lint" en local
        run: >
          docker run --rm -v "$PWD":/mnt:ro -w /mnt koalaman/shellcheck:v0.11.0
          -x -S warning
          launch.sh manage-profiles.sh validate-profiles.sh menu.sh lib/yq.sh lib/json.sh
          tests/run-tests.sh tests/compare-shells.sh

  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyser les scripts PowerShell
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $results | Format-Table -AutoSize -Property ScriptName, Line, RuleName, Message
          if ($results) { exit 1 }

  schemas:
    name: Schemas JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valider les profils et la configuration avec leurs schemas
        run: |
          pipx run check-jsonschema==0.39.0 --schemafile schemas/profile.schema.json \
            profiles/*.yml tests/fixtures/profiles/*.yml
          pipx run check-jsonschema==0.39.0 --schemafile schemas/config.schema.json \
            config.yml tests/fixtures/config.yml

  test-bash:
    name: Tests Bash (yq ${{ matrix.yq }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        yq: [local, docker]
    steps:
      - uses: actions/checkout@v4
      - name: Retirer yq pour forcer l'image Docker
        if: matrix.yq == 'docker'
        run: |
          while command -v yq >/dev/null 2>&1; do sudo rm -f "$(command -v yq)"; done
      - name: Vérifier yq local
        if: matrix.yq == 'local'
        run: yq --version
      - name: Exécuter les tests
        run: tests/run-tests.sh

  test-powershell:
    name: Tests PowerShell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer powershell-yaml
        shell: pwsh
        run: Install-Module powershell-yaml -Force -Scope CurrentUser
      - name: Générer et valider avec les scripts PowerShell
        run: tests/compare-shells.sh --powershell-only

  shell-parity:
    name: Parité Bash / PowerShell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer powershell-yaml
        shell: pwsh
        run: Install-Module powershell-yaml -Force -Scope CurrentUser
      - name: Comparer les fichiers générés
        run: tests/compare-shells.sh
