# Configuration Traefik principale
api:
  dashboard: true
  insecure: true

providers:
  docker:
    # Accès à l'API Docker via le proxy en lecture seule (service socket-proxy)
    endpoint: "tcp://socket-proxy:2375"
    exposedByDefault: false
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

entryPoints:
  web:
    address: ":80"

ping: {}

log:
  level: INFO
