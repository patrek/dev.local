# Sans section secrets:, environnement en map : même auto-détection qu'en liste
name: secrets-map
description: "Secrets auto-détectés (map)"
enabled: true
always_active: true
docker_profile: null

docker-compose:
  image: nginx:alpine
  container_name: secrets-map
  environment:
    MAP_TOKEN: ${MAP_TOKEN:-changeme}
    MAP_BARE: ${MAP_BARE}
    MAP_PLAIN: value

traefik:
  enabled: false
