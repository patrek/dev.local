# Sans section secrets:, environnement en map : même auto-détection qu'en liste.
# Clés en ordre alphabétique : manage-profiles.ps1 les trie, manage-profiles.sh garde leur ordre.
name: secrets-map
description: "Secrets auto-détectés (map)"
enabled: true
always_active: true
docker_profile: null

docker-compose:
  image: nginx:alpine
  container_name: secrets-map
  environment:
    MAP_BARE: ${MAP_BARE}
    MAP_PLAIN: value
    MAP_TOKEN: ${MAP_TOKEN:-changeme}

traefik:
  enabled: false
