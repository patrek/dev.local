# Sans section secrets:, environnement en liste : sync-secrets auto-détecte les
# ${VAR:-défaut} de environment, pas les ${VAR} nus, les noms en minuscules, ni les
# variables de l'image, des ports ou des commentaires comme ${AUTO_COMMENT:-ignore}
name: secrets-auto
description: "Secrets auto-détectés (liste)"
enabled: true
always_active: true
docker_profile: null

docker-compose:
  image: nginx:${AUTO_IMAGE_TAG:-alpine}
  container_name: secrets-auto
  ports:
    - "${AUTO_PORT:-8010}:80"
  environment:
    - AUTO_TOKEN=${AUTO_TOKEN:-changeme}
    - AUTO_BARE=${AUTO_BARE}
    - AUTO_URL=https://${AUTO_USER:-user}:${AUTO_PASSWORD:-}@example.com
    - AUTO_LOWER=${auto_lower:-ignore}

traefik:
  enabled: false
