# Indentation de 4 espaces : les ports sont retirés (expose_ports absent) et
# environment reçoit les variables partagées, comme avec 2 espaces
name: indent4
description: "Profil indenté de 4 espaces"
enabled: true
always_active: true
docker_profile: null

docker-compose:
    image: nginx:alpine
    container_name: indent4
    ports:
        - "8023:80"
    environment:
        - INDENT_MODE=four
    healthcheck:
        test: ["CMD", "true"]
        interval: 30s

traefik:
    enabled: false
