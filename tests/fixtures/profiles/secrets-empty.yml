# Section secrets: vide : aucun secret, et pas d'auto-détection dans environment
name: secrets-empty
description: "Section secrets vide"
enabled: true
always_active: true
docker_profile: null

docker-compose:
  image: nginx:alpine
  container_name: secrets-empty
  environment:
    - EMPTY_SECTION=${EMPTY_SECTION:-ignore}

traefik:
  enabled: false

secrets: []
