# Section secrets: explicite : elle seule compte, les variables de environment
# qui n'y sont pas déclarées ne sont pas des secrets
name: secrets-explicit
description: "Secrets déclarés"
enabled: true
always_active: true
docker_profile: null

docker-compose:
  image: nginx:alpine
  container_name: secrets-explicit
  environment:
    - EXPLICIT_FIRST=${EXPLICIT_FIRST:-changeme}
    - EXPLICIT_UNDECLARED=${EXPLICIT_UNDECLARED:-ignore}

traefik:
  enabled: false

secrets:
  - name: EXPLICIT_FIRST
    description: "Sans valeur par défaut"
  - name: EXPLICIT_SECOND
    description: "Suit un secret sans valeur par défaut"
  - name: "EXPLICIT_QUOTED"  # nom entre guillemets
    default: "quoted"
